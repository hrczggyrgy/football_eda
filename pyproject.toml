[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "football-analytics"
version = "0.2.0"
description = "Exploratory data analysis of 7 seasons (2019/20–2025/26) across 8 European football leagues"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
dependencies = [
    "polars>=1.21.0,<3.0.0",  # min_samples rolling API (renamed from min_periods in 1.21.0)
    "duckdb>=0.8.0",
    "pyarrow>=8.0.0",
    "numpy>=1.24.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "scikit-learn>=1.3.0",
    "scipy>=1.10.0",
    # pandas is retained only as a compatibility layer at the Matplotlib/seaborn
    # plotting boundary; it is no longer the primary data-processing engine.
    "pandas>=2.0.0",
]
keywords = ["football", "analytics", "sports", "data-analysis", "eda"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Information Analysis",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
]

[project.urls]
Homepage = "https://github.com/hrczggyrgy/football_eda"
Repository = "https://github.com/hrczggyrgy/football_eda"
Issues = "https://github.com/hrczggyrgy/football_eda/issues"

[tool.setuptools.packages.find]
where = ["src"]
include = ["*"]

[tool.setuptools.package-dir]
"" = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
filterwarnings = [
    # joblib/NumPy 2.5 environment incompatibility in joblib's internals;
    # not code we own. Ignore only this specific deprecation.
    "ignore:Setting the shape on a NumPy array has been deprecated:DeprecationWarning",
]
markers = [
    "perf: performance regression tests (timing-based, run with -m perf)",
]

[tool.black]
line-length = 100
target-version = ["py39"]
include = "\\.py$"

[tool.ruff]
line-length = 100
target-version = "py39"
select = ["E", "F", "I", "W", "UP", "B", "C4", "SIM", "T20"]
ignore = ["E501", "B008"]